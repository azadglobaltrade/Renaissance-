function dashboard(){let c=counts(),today=new Date().toISOString().slice(0,10),todayTasks=state.tasks.filter(t=>t.due===today&&!t.done),todayMins=state.sessions.filter(s=>s.date===today).reduce((n,s)=>n+(+s.minutes||0),0);document.getElementById('main').innerHTML=`
<div class="pagehead"><div><h1>Learning overview</h1><div class="muted small">Build knowledge. Test it. Apply it.</div></div><button class="btn" onclick="openTask()">＋ Add task</button></div>
<div class="grid"><div class="card"><div class="stat">${c.done}/${c.total}</div><div class="statlabel">Mastered topics</div></div><div class="card"><div class="stat">${c.started}</div><div class="statlabel">Topics started</div></div><div class="card"><div class="stat">${state.tasks.filter(t=>!t.done).length}</div><div class="statlabel">Open tasks</div></div><div class="card"><div class="stat">${Math.round(todayMins/60*10)/10}h</div><div class="statlabel">Studied today</div></div></div>
<div class="section">Academy progress <span class="muted small">${Math.round(c.done/c.total*100)}% mastered</span></div><div class="card"><div class="bar"><span style="width:${c.done/c.total*100}%"></span></div><div class="row small muted" style="margin-top:8px"><span>${c.done} mastered</span><span>${c.total-c.done} remaining</span></div></div>
<div class="section">Today's priorities</div><div class="card">${todayTasks.length?todayTasks.map(t=>taskHTML(t)).join(''):'<div class="empty">No tasks due today. Add a focused learning task.</div>'}</div>
<div class="section">Explore all 12 schools</div><div class="schoolgrid">${CURRICULUM.map((s,i)=>schoolCard(s,i)).join('')}</div>`}
function schoolCard(s,i){let n=s.departments.reduce((v,d)=>v+d.topics.length,0);return `<button class="school" onclick="openSchool(${i})"><div class="schoolnum">SCHOOL ${String(i+1).padStart(2,'0')}</div><h3>${esc(s.name)}</h3><p>${s.departments.length} departments · ${n} topics</p><div class="row small"><span class="muted">${pct(i)}% mastered</span><span>→</span></div><div class="bar" style="margin-top:7px"><span style="width:${pct(i)}%"></span></div></button>`}
function academy(){document.getElementById('main').innerHTML=`<div class="pagehead"><div><h1>12 Schools of Knowledge</h1><div class="muted small">Browse schools, departments and topic-level curriculum.</div></div></div><input class="input search" id="schoolSearch" placeholder="Search schools, departments or topics…" oninput="filterAcademy(this.value)"><div class="schoolgrid" id="schoolGrid">${CURRICULUM.map((s,i)=>schoolCard(s,i)).join('')}</div>`}
function filterAcademy(q){q=q.toLowerCase();document.getElementById('schoolGrid').innerHTML=CURRICULUM.map((s,i)=>({s,i})).filter(x=>(x.s.name+' '+x.s.objective+' '+x.s.departments.map(d=>d.name+' '+d.topics.join(' ')).join(' ')).toLowerCase().includes(q)).map(x=>schoolCard(x.s,x.i)).join('')||'<div class="empty">No matching curriculum found.</div>'}
function openSchool(si){let s=CURRICULUM[si],topics=s.departments.reduce((a,d)=>a+d.topics.length,0);document.getElementById('main').innerHTML=`<div class="pagehead"><div><button class="btn ghost smallbtn" onclick="academy()">← All schools</button><h1 style="margin-top:12px">${esc(s.name)}</h1><div class="muted small">${esc(s.objective)}</div></div><span class="pill">${pct(si)}% mastered</span></div><div class="card"><div class="row"><b>${s.departments.length} departments</b><span class="muted small">${topics} topics</span></div><div class="bar" style="margin-top:10px"><span style="width:${pct(si)}%"></span></div></div>${s.departments.map((d,di)=>`<details class="dept" open><summary>${esc(d.name)} <span class="muted small">· ${d.topics.length} topics</span></summary><div class="deptbody">${d.topics.map((t,ti)=>topicHTML(si,di,ti,t)).join('')}</div></details>`).join('')}`}
function topicHTML(si,di,ti,t){let st=topicStatus(si,di,ti);return `<div class="topic"><input type="checkbox" ${st==='Mastered'?'checked':''} aria-label="Mark mastered" onchange="setTopic(${si},${di},${ti},this.checked?'Mastered':'Learning')"><div style="flex:1;min-width:0"><div class="topicname">${esc(t)}</div><div class="topicmeta">${esc(st)}</div></div><button class="btn ghost smallbtn" onclick="editTopic(${si},${di},${ti})">Update</button></div>`}
function setTopic(si,di,ti,st){state.topics[topicKey(si,di,ti)]=st;save();openSchool(si);toast('Topic progress saved')}
function editTopic(si,di,ti){let t=CURRICULUM[si].departments[di].topics[ti],st=topicStatus(si,di,ti),note=state.notes[topicKey(si,di,ti)]||'';showModal(`<h2>Update topic</h2><b>${esc(t)}</b><div class="field"><label>Learning status</label><select id="topicStatus">${['Not started','Learning','Practicing','Applied','Revision','Mastered'].map(x=>`<option ${x===st?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Learning notes / next action</label><textarea id="topicNote" rows="4" placeholder="Key ideas, questions, resources, next steps…">${esc(note)}</textarea></div><div class="actions"><button class="btn" onclick="saveTopic(${si},${di},${ti})">Save changes</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`)}
function saveTopic(si,di,ti){state.topics[topicKey(si,di,ti)]=document.getElementById('topicStatus').value;state.notes[topicKey(si,di,ti)]=document.getElementById('topicNote').value;save();closeModal();openSchool(si);toast('Topic updated')}
function taskHTML(t){return `<div class="listitem"><div class="taskrow"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}')"><div style="flex:1"><div class="${t.done?'taskdone':''}"><b>${esc(t.title)}</b></div><div class="small muted">${esc(t.school||'General')} · ${esc(t.due||'No deadline')} · ${esc(t.priority||'Normal')}</div>${t.details?`<div class="small muted">${esc(t.details)}</div>`:''}</div><button class="btn ghost smallbtn" onclick="deleteTask('${t.id}')">Delete</button></div></div>`}
function tasks(){let open=state.tasks.filter(t=>!t.done),done=state.tasks.filter(t=>t.done);document.getElementById('main').innerHTML=`<div class="pagehead"><div><h1>Task manager</h1><div class="muted small">Turn learning intentions into scheduled actions.</div></div><button class="btn" onclick="openTask()">＋ Add task</button></div><div class="tabs"><button class="active" onclick="taskFilter('open',this)">Open (${open.length})</button><button onclick="taskFilter('all',this)">All (${state.tasks.length})</button><button onclick="taskFilter('done',this)">Completed (${done.length})</button></div><div class="card" id="taskList">${open.length?open.sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999')).map(taskHTML).join(''):'<div class="empty">No open tasks. Add your next learning action.</div>'}</div>`}
function taskFilter(which,btn){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');let arr=which==='all'?state.tasks:which==='done'?state.tasks.filter(t=>t.done):state.tasks.filter(t=>!t.done);document.getElementById('taskList').innerHTML=arr.length?arr.map(taskHTML).join(''):'<div class="empty">Nothing here yet.</div>'}
function openTask(){showModal(`<h2>Add learning task</h2><div class="field"><label>Task title *</label><input class="input" id="taskTitle" placeholder="e.g. Solve 5 probability problems"></div><div class="field"><label>Related school</label><select id="taskSchool"><option value="">General / personal</option>${CURRICULUM.map((s,i)=>`<option value="${esc(s.name)}">${String(i+1).padStart(2,'0')} · ${esc(s.name)}</option>`).join('')}</select></div><div class="two"><div class="field"><label>Due date</label><input class="input" type="date" id="taskDue" value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Priority</label><select id="taskPriority"><option>High</option><option selected>Normal</option><option>Low</option></select></div></div><div class="field"><label>Details / definition of done</label><textarea class="input" id="taskDetails" rows="3"></textarea></div><div class="actions"><button class="btn" onclick="saveTask()">Create task</button><button class="btn ghost" onclick="closeModal()">Cancel</button></div>`)}
function saveTask(){let title=document.getElementById('taskTitle').value.trim();if(!title){toast('Enter a task title');return}state.tasks.unshift({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title,school:document.getElementById('taskSchool').value,due:document.getElementById('taskDue').value,priority:document.getElementById('taskPriority').value,details:document.getElementById('taskDetails').value,done:false,created:new Date().toISOString()});save();closeModal();tasks();toast('Task created')}
function toggleTask(id){let t=state.tasks.find(x=>x.id===id);if(t)t.done=!t.done;save();tasks()}
function deleteTask(id){if(confirm('Delete this task?')){state.tasks=state.tasks.filter(t=>t.id!==id);save();tasks()}}
function planner(){let today=new Date().toISOString().slice(0,10);document.getElementById('main').innerHTML=`<div class="pagehead"><div><h1>Study planner</h1><div class="muted small">Log focused study sessions and review your daily effort.</div></div></div><div class="card"><h3 style="margin-top:0">Log a study session</h3><div class="two"><div class="field"><label>Date</label><input class="input" type="date" id="sessionDate" value="${today}"></div><div class="field"><label>Duration (minutes)</label><input class="input" type="number" min="1" id="sessionMins" value="45"></div></div><div class="field"><label>School</label><select id="sessionSchool">${CURRICULUM.map(s=>`<option>${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>What did you study?</label><input class="input" id="sessionWhat" placeholder="Topic, chapter or activity"></div><div class="field"><label>Reflection / output</label><textarea class="input" id="sessionNote" rows="2" placeholder="What did you understand or produce?"></textarea></div><button class="btn" onclick="saveSession()">Save study session</button></div><div class="section">Recent sessions</div><div class="card">${state.sessions.length?state.sessions.slice().reverse().slice(0,30).map(s=>`<div class="listitem"><div class="row"><b>${esc(s.what||s.school)}</b><span class="pill">${s.minutes} min</span></div><div class="small muted">${esc(s.date)} · ${esc(s.school)}</div>${s.note?`<div class="small">${esc(s.note)}</div>`:''}</div>`).join(''):'<div class="empty">No study sessions logged yet.</div>'}</div>`}
function saveSession(){let minutes=+document.getElementById('sessionMins').value;if(!minutes||minutes<1){toast('Enter a valid duration');return}state.sessions.push({date:document.getElementById('sessionDate').value,minutes,school:document.getElementById('sessionSchool').value,what:document.getElementById('sessionWhat').value,note:document.getElementById('sessionNote').value});save();planner();toast('Study session saved')}
function projects(){document.getElementById('main').innerHTML=`<div class="pagehead"><div><h1>Founder laboratory</h1><div class="muted small">Apply academy knowledge to practical projects.</div></div><button class="btn" onclick="openProject()">＋ Project</button></div><div class="card">${state.projects.length?state.projects.map(p=>`<div class="listitem"><div class="row"><b>${esc(p.title)}</b><span class="pill">${esc(p.status)}</span></div><div class="small muted">${esc(p.school||'Cross-disciplinary')} · Due ${esc(p.due||'not set')}</div><p class="small">${esc(p.description)}</p><button class="btn ghost smallbtn" onclick="updateProject('${p.id}')">Update status</button></div>`).join(''):'<div class="empty">No projects yet. Create a practical project such as an AGT cash-flow model or importer intelligence database.</div>'}</div>`}
function openProject(){showModal(`<h2>New practical project</h2><div class="field"><label>Project name *</label><input class="input" id="projectTitle" placeholder="Build a buyer qualification model"></div><div class="field"><label>Related school</label><select id="projectSchool"><option>Cross-disciplinary</option>${CURRICULUM.map(s=>`<option>${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Description / deliverable</label><textarea class="input" id="projectDesc" rows="3"></textarea></div><div class="field"><label>Target date</label><input class="input" type="date" id="projectDue"></div><button class="btn" onclick="saveProject()">Create project</button>`)}
function saveProject(){let title=document.getElementById('projectTitle').value.trim();if(!title){toast('Enter project name');return}state.projects.push({id:String(Date.now()),title,school:document.getElementById('projectSchool').value,description:document.getElementById('projectDesc').value,due:document.getElementById('projectDue').value,status:'Planned'});save();closeModal();projects()}
function updateProject(id){let p=state.projects.find(x=>x.id===id);if(!p)return;showModal(`<h2>Update project</h2><b>${esc(p.title)}</b><div class="field"><label>Status</label><select id="projectStatus">${['Planned','In progress','Blocked','Completed'].map(s=>`<option ${p.status===s?'selected':''}>${s}</option>`).join('')}</select></div><button class="btn" onclick="saveProjectStatus('${id}')">Save</button>`)}
function saveProjectStatus(id){let p=state.projects.find(x=>x.id===id);p.status=document.getElementById('projectStatus').value;save();closeModal();projects()}
function analytics(){let c=counts(),mins=state.sessions.reduce((a,s)=>a+(+s.minutes||0),0),completed=state.tasks.filter(t=>t.done).length;document.getElementById('main').innerHTML=`<div class="pagehead"><div><h1>Analytics</h1><div class="muted small">Measure progress, not just activity.</div></div><button class="btn secondary" onclick="exportData()">Export backup</button></div><div class="grid"><div class="card"><div class="stat">${Math.round(c.done/c.total*100)}%</div><div class="statlabel">Curriculum mastery</div></div><div class="card"><div class="stat">${(mins/60).toFixed(1)}</div><div class="statlabel">Total study hours</div></div><div class="card"><div class="stat">${completed}</div><div class="statlabel">Tasks completed</div></div><div class="card"><div class="stat">${state.projects.filter(p=>p.status==='Completed').length}</div><div class="statlabel">Projects completed</div></div></div><div class="section">Progress by school</div><div class="card">${CURRICULUM.map((s,i)=>`<div class="listitem"><div class="row"><b class="small">${String(i+1).padStart(2,'0')} · ${esc(s.name)}</b><span class="small muted">${pct(i)}%</span></div><div class="bar" style="margin-top:7px"><span style="width:${pct(i)}%"></span></div></div>`).join('')}</div><div class="section">Learning status distribution</div><div class="card">${['Not started','Learning','Practicing','Applied','Revision','Mastered'].map(st=>{let n=allTopics().filter(t=>t.status===st).length;return `<div class="row listitem"><span>${st}</span><b>${n}</b></div>`}).join('')}</div>`}
function showModal(html){document.getElementById('modal').innerHTML=html;document.getElementById('modalbg').classList.add('show')}
function closeModal(){document.getElementById('modalbg').classList.remove('show')}
function exportData(){let blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='renaissance-founder-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Backup exported')}
function importData(){let i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);state=x.state||x;save();page('dashboard');toast('Backup restored')}catch(e){alert('Invalid backup file')}};r.readAsText(f)};i.click()}
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
page('dashboard');
</script></body></html>
